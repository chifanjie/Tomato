name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native_kernel_bridge:
    name: Native SafeGit bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native descriptor-binding gate
        run: |
          pnpm --filter @understand-code/native-kernel-bridge --fail-if-no-match typecheck
          pnpm --filter @understand-code/native-kernel-bridge --fail-if-no-match test
          pnpm --filter @understand-code/durable-object-provider-contracts --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-runtime --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-authority --fail-if-no-match build
          pnpm --filter @understand-code/contracts --fail-if-no-match build
          pnpm --filter @understand-code/repository-state --fail-if-no-match build
          pnpm --filter @understand-code/repository-state --fail-if-no-match exec vitest run test/safe-git-bootstrap.test.ts --maxWorkers=1

  provider_unit:
    name: Provider unit gate
    runs-on: ubuntu-latest
    # The contract suite includes the full fixture matrix and can exceed the
    # default runner window without being hung. Keep the hard timeout, but
    # give the unit shard the same headroom as the aggregate gate.
    timeout-minutes: 90
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Provider unit gate
        working-directory: packages/durable-object-provider-contracts
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm exec vitest run --maxWorkers=1

  provider_distribution:
    name: Provider distribution gate
    needs: provider_unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Provider distribution gate
        working-directory: packages/durable-object-provider-contracts
        run: |
          pnpm run build
          pnpm run test:distribution

  provider_aggregate:
    name: Provider C09 aggregate gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Provider aggregate gate
        working-directory: packages/durable-object-provider-contracts
        run: pnpm run test:c09-aggregate

  provider_production_linux:
    name: Provider production Linux/ext4 gate
    needs:
      - provider_unit
      - provider_distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      # Repository-owned configuration is explicit; GitHub does not expose
      # Actions variables to the runner process unless the workflow maps them.
      UNDERSTAND_CODE_CODEX_CLI: ${{ vars.UNDERSTAND_CODE_CODEX_CLI }}
      UNDERSTAND_CODE_CLAUDE_CLI: ${{ vars.UNDERSTAND_CODE_CLAUDE_CLI }}
      UNDERSTAND_CODE_STEP16_GOLD_VERIFIER_PUBLIC_KEY_SPKI_BASE64: ${{ vars.UNDERSTAND_CODE_STEP16_GOLD_VERIFIER_PUBLIC_KEY_SPKI_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Provider production closure
        run: |
          pnpm --filter @understand-code/native-kernel-bridge --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-contracts --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-runtime --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-client --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-authority --fail-if-no-match build
          pnpm --filter @understand-code/host-adapters --fail-if-no-match build
          pnpm --filter @understand-code/contracts --fail-if-no-match build
          pnpm --filter @understand-code/installation-lifecycle --fail-if-no-match build
          pnpm --filter @understand-code/workbench-runtime --fail-if-no-match build
          pnpm --filter @understand-code/repository-state --fail-if-no-match build
          pnpm --filter @understand-code/artifact-store --fail-if-no-match build
          pnpm --filter @understand-code/core --fail-if-no-match build
          pnpm --filter @understand-code/task-engine --fail-if-no-match build
          pnpm --filter @understand-code/cli --fail-if-no-match build
          pnpm --filter @understand-code/dashboard --fail-if-no-match build
          pnpm --filter @understand-code/preview --fail-if-no-match build

      - name: Prepare production SafeGit and principals
        run: |
          sudo install -d -o root -g root -m 0755 /opt/understand-code/bin
          sudo install -o root -g root -m 0755 "$(command -v git)" /opt/understand-code/bin/git
          test "$(stat -c '%u:%g:%a:%h' /opt/understand-code/bin/git)" = "0:0:755:1"
          getent group 42002 >/dev/null || sudo groupadd --gid 42002 understand-code-runtime
          getent passwd 42001 >/dev/null || sudo useradd --uid 42001 --gid 42002 --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin understand-code-runtime
          getent group 42004 >/dev/null || sudo groupadd --gid 42004 understand-code-caller
          getent passwd 42003 >/dev/null || sudo useradd --uid 42003 --gid 42004 --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin understand-code-caller
          getent group 42006 >/dev/null || sudo groupadd --gid 42006 understand-code-foreign
          getent passwd 42005 >/dev/null || sudo useradd --uid 42005 --gid 42006 --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin understand-code-foreign

      - name: Prepare dedicated ext4 target
        run: |
          command -v mkfs.ext4
          sudo mkdir -p /var/mnt/uc-step15-ext4-root
          sudo truncate -s 2G /var/tmp/uc-step15-ext4.img
          sudo mkfs.ext4 -F /var/tmp/uc-step15-ext4.img
          sudo mount -o loop,nodev,nosuid /var/tmp/uc-step15-ext4.img /var/mnt/uc-step15-ext4-root
          test "$(findmnt -n -o FSTYPE --target /var/mnt/uc-step15-ext4-root)" = "ext4"

      - name: Collect Provider and Step16 Linux evidence
        run: |
          browser_executable="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -x "$browser_executable"
          browser_executable="$(readlink -f "$browser_executable")"
          sudo env "PATH=$PATH" CI=true NODE_ENV=production \
            PROVIDER_EXACT_OBJECT_EXT4_TEST_ROOT=/var/mnt/uc-step15-ext4-root \
            pnpm --filter @understand-code/native-kernel-bridge --fail-if-no-match \
              run test:linux-exact-object
          sudo install -d -m 0700 /var/mnt/uc-step15-ext4-root/secure-tmp
          sudo mkdir -p /sys/fs/cgroup/understand-code-safe-git-supervisor-v1
          closing_evidence_dir=/var/mnt/uc-step15-ext4-root/step16-closing-evidence
          sudo install -d -o root -g root -m 0700 "$closing_evidence_dir"
          closing_evidence_path="$closing_evidence_dir/step16-closing-evidence-$(openssl rand -hex 16).json"
          test ! -e "$closing_evidence_path"
          echo "UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH=$closing_evidence_path" >> "$GITHUB_ENV"
          sudo env "PATH=$PATH" \
            "UNDERSTAND_CODE_BROWSER_EXECUTABLE=$browser_executable" \
            "UNDERSTAND_CODE_CODEX_CLI=${UNDERSTAND_CODE_CODEX_CLI:-}" \
            "UNDERSTAND_CODE_CLAUDE_CLI=${UNDERSTAND_CODE_CLAUDE_CLI:-}" \
            "UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH=$closing_evidence_path" \
            bash -c '
            echo $$ > /sys/fs/cgroup/understand-code-safe-git-supervisor-v1/cgroup.procs
            exec env PATH="$PATH" CI=true NODE_ENV=production \
              RUN_STEP15_PROVIDER_E2E=1 RUN_STEP16_DUAL_HOST_E2E=1 \
              UNDERSTAND_CODE_BROWSER_EXECUTABLE="$UNDERSTAND_CODE_BROWSER_EXECUTABLE" \
              UNDERSTAND_CODE_CODEX_CLI="$UNDERSTAND_CODE_CODEX_CLI" \
              UNDERSTAND_CODE_CLAUDE_CLI="$UNDERSTAND_CODE_CLAUDE_CLI" \
              UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH="$UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH" \
              TMPDIR=/var/mnt/uc-step15-ext4-root/secure-tmp \
              pnpm --filter @understand-code/durable-object-provider-runtime --fail-if-no-match exec vitest run \
                test/provider-production-strong-object-three-principal-linux.test.ts \
                test/provider-production-strong-client-trust-lifecycle-linux.test.ts \
                test/provider-production-strong-client-trust-lifecycle-crash-linux.test.ts \
                --maxWorkers=1
          '
          sudo rmdir /sys/fs/cgroup/understand-code-safe-git-supervisor-v1

      - name: Enforce mandatory Step16 closing gate
        run: |
          sudo env "PATH=$PATH" \
            "UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH=$UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH" \
            "UNDERSTAND_CODE_STEP16_GOLD_VERIFIER_PUBLIC_KEY_SPKI_BASE64=${UNDERSTAND_CODE_STEP16_GOLD_VERIFIER_PUBLIC_KEY_SPKI_BASE64:-}" \
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { Step16DualHostEvidenceV1Schema } from "./packages/contracts/dist/alpha-gold.js";
          import { verifyStep16DualHostEligibleEvidenceV1 } from "./packages/contracts/scripts/alpha-gold-verifier.mjs";
          const evidencePath = process.env.UNDERSTAND_CODE_STEP16_CLOSING_EVIDENCE_PATH;
          if (evidencePath === undefined) throw new Error("closing evidence path missing");
          const parsed = Step16DualHostEvidenceV1Schema.safeParse(JSON.parse(await readFile(
            evidencePath,
            "utf8",
          )));
          if (!parsed.success) {
            process.stderr.write(`${JSON.stringify({
              schemaVersion: 1,
              profile: "step16_closing_gate_v1",
              status: "failed",
              code: "evidence_schema_invalid",
            })}\n`);
            process.exit(1);
          }
          const evidence = parsed.data;
          if (evidence.status !== "eligible") {
            process.stderr.write(`${JSON.stringify({
              schemaVersion: 1,
              profile: "step16_closing_gate_v1",
              status: "blocked",
              evidenceStatus: evidence.status,
              hostBlocker: evidence.hostExecution?.blocker ?? null,
              blockers: evidence.goldGate?.g3?.blockers ?? [],
            })}\n`);
            process.exitCode = 1;
          } else {
            const trustedVerifier =
              process.env.UNDERSTAND_CODE_STEP16_GOLD_VERIFIER_PUBLIC_KEY_SPKI_BASE64;
            if (
              trustedVerifier === undefined ||
              trustedVerifier.length === 0 ||
              !verifyStep16DualHostEligibleEvidenceV1(evidence, trustedVerifier)
            ) {
              process.stderr.write(`${JSON.stringify({
                schemaVersion: 1,
                profile: "step16_closing_gate_v1",
                status: "failed",
                code: "gold_receipt_root_verification_failed",
              })}\n`);
              process.exitCode = 1;
            }
          }
          NODE

      - name: Remove dedicated ext4 target
        if: ${{ always() }}
        run: |
          sudo rmdir /sys/fs/cgroup/understand-code-safe-git-supervisor-v1 2>/dev/null || true
          mountpoint -q /var/mnt/uc-step15-ext4-root && sudo umount /var/mnt/uc-step15-ext4-root || true
          sudo rm -f /var/tmp/uc-step15-ext4.img

  workspace_quality:
    name: Workspace quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare native-safe workspace home
        run: |
          # GitHub's workspace volume does not consistently expose the
          # descriptor xattr calls used by the native FD gate.  /run is a
          # private tmpfs on the hosted Linux image and keeps the authority
          # ancestry owner-only without weakening the production checks.
          ci_home="/run/understand-code-ci-home-${GITHUB_RUN_ID}"
          ci_tmp="$ci_home/tmp"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$ci_home"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$ci_tmp"
          test "$(stat -c '%u:%g:%a' "$ci_home")" = "$(id -u):$(id -g):700"
          test "$(stat -c '%u:%g:%a' "$ci_tmp")" = "$(id -u):$(id -g):700"
          echo "UNDERSTAND_CODE_CI_HOME=$ci_home" >> "$GITHUB_ENV"
          echo "HOME=$ci_home" >> "$GITHUB_ENV"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"

      - name: Run workspace quality gate
        run: |
          pnpm run build:all
          pnpm run typecheck
          pnpm --filter @understand-code/durable-object-provider-contracts --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-client --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-runtime --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-authority --fail-if-no-match build
          pnpm --filter @understand-code/host-adapters --fail-if-no-match build
          pnpm --filter @understand-code/contracts --fail-if-no-match build
          pnpm --filter @understand-code/workbench-runtime --fail-if-no-match build
          pnpm --filter @understand-code/repository-state --fail-if-no-match build
          pnpm --filter @understand-code/artifact-store --fail-if-no-match build
          pnpm --filter @understand-code/core --fail-if-no-match build
          pnpm --filter @understand-code/task-engine --fail-if-no-match build
          pnpm --filter @understand-code/durable-object-provider-client --fail-if-no-match test
          pnpm --filter @understand-code/durable-object-provider-runtime --fail-if-no-match test
          pnpm --filter @understand-code/durable-object-provider-authority --fail-if-no-match test
          pnpm --filter @understand-code/host-adapters --fail-if-no-match test
          pnpm --filter @understand-code/contracts --fail-if-no-match test
          pnpm --filter @understand-code/installation-lifecycle --fail-if-no-match test
          pnpm --filter @understand-code/workbench-runtime --fail-if-no-match test
          pnpm --filter @understand-code/repository-state --fail-if-no-match test
          pnpm --filter @understand-code/artifact-store --fail-if-no-match test
          pnpm run test:skill
          pnpm --filter @understand-code/core --fail-if-no-match test
          pnpm --filter @understand-code/task-engine --fail-if-no-match test
          pnpm --filter @understand-code/cli --fail-if-no-match test
          pnpm --filter @understand-code/dashboard --fail-if-no-match test
          pnpm --filter @understand-code/preview --fail-if-no-match test:runtime

      - name: Audit active dashboard surface
        run: pnpm --filter @understand-code/dashboard audit:surface

      - name: Remove native-safe workspace home
        if: ${{ always() }}
        run: |
          expected_ci_home="/run/understand-code-ci-home-${GITHUB_RUN_ID}"
          if [ "${UNDERSTAND_CODE_CI_HOME:-}" = "$expected_ci_home" ]; then
            sudo rm -rf -- "$expected_ci_home"
          fi

  preview_candidate:
    name: Preview candidate package
    needs:
      - native_kernel_bridge
      - provider_unit
      - provider_distribution
      - provider_aggregate
      - provider_production_linux
      - workspace_quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and cold-test Preview package
        run: |
          pnpm --filter @understand-code/preview --fail-if-no-match build
          pnpm --filter @understand-code/preview --fail-if-no-match typecheck
          pnpm --filter @understand-code/preview --fail-if-no-match test:runtime
          mkdir -p preview-artifacts
          (cd packages/preview && npm pack . --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/preview-artifacts")
          mapfile -t PREVIEW_TARBALLS < <(find "$GITHUB_WORKSPACE/preview-artifacts" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#PREVIEW_TARBALLS[@]}" -eq 1
          PREVIEW_TARBALL="${PREVIEW_TARBALLS[0]}"
          UNDERSTAND_CODE_PREVIEW_TARBALL="$PREVIEW_TARBALL" pnpm --filter @understand-code/preview --fail-if-no-match test:cold
          (cd preview-artifacts && sha256sum "$(basename "$PREVIEW_TARBALL")" > understand-code-preview.sha256)
          (cd preview-artifacts && sha256sum --check understand-code-preview.sha256)

      - name: Upload installable Preview Candidate
        uses: actions/upload-artifact@v6
        with:
          name: understand-code-preview-${{ github.sha }}
          path: |
            preview-artifacts/understand-code-preview-0.1.0-preview.1.tgz
            preview-artifacts/understand-code-preview.sha256
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - native_kernel_bridge
      - provider_unit
      - provider_distribution
      - provider_aggregate
      - provider_production_linux
      - workspace_quality
      - preview_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVIDER_UNIT_RESULT: ${{ needs.provider_unit.result }}
      NATIVE_KERNEL_BRIDGE_RESULT: ${{ needs.native_kernel_bridge.result }}
      PROVIDER_DISTRIBUTION_RESULT: ${{ needs.provider_distribution.result }}
      PROVIDER_AGGREGATE_RESULT: ${{ needs.provider_aggregate.result }}
      PROVIDER_PRODUCTION_LINUX_RESULT: ${{ needs.provider_production_linux.result }}
      WORKSPACE_QUALITY_RESULT: ${{ needs.workspace_quality.result }}
      PREVIEW_CANDIDATE_RESULT: ${{ needs.preview_candidate.result }}

    steps:
      - name: Require every quality shard
        run: |
          test "$NATIVE_KERNEL_BRIDGE_RESULT" = "success"
          test "$PROVIDER_UNIT_RESULT" = "success"
          test "$PROVIDER_DISTRIBUTION_RESULT" = "success"
          test "$PROVIDER_AGGREGATE_RESULT" = "success"
          test "$PROVIDER_PRODUCTION_LINUX_RESULT" = "success"
          test "$WORKSPACE_QUALITY_RESULT" = "success"
          test "$PREVIEW_CANDIDATE_RESULT" = "success"
